<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            ul, ol {
                list-style-type: none;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #333333;
                position: fixed;
                width: 100%;
            }

            ul li, ol li {
                float: left;
            }

            ul li a, ol li a {
                display: block;
                color: rgb(255, 255, 255);
                text-align: center;
                padding: 16px;
                text-decoration: none;
            }

            ul li a:hover, ol li a:hover {
                border-bottom: 3px solid blue;
                background-color: #1111;
            }
            /* Si quieres que los <li> de la lista ordenada también sean clickeables, pon los elementos dentro de <a> */
    </style>
</head>
