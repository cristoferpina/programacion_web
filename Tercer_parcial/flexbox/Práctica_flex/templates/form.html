<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="../styles/form.css">
</head>
<body>

  <div class="pagina">

    <section class="hero">
      <h1>Pedido de comida</h1>
      <p>Rápido, fácil y a tu puerta</p>
    </section>

    <div class="contenido">

      <div class="card formulario">
        <h2>Datos del pedido</h2>

        <form>
          <label>Nombre</label>
          <input type="text" placeholder="Tu nombre">

          <label>Dirección</label>
          <input type="text" placeholder="Dirección de entrega">

          <label>Pedido</label>
          <input type="text" placeholder="Ej. Pizza, tacos, hamburguesa">

          <label>Método de pago</label>
          <div class="radio">
            <input type="radio" name="pago"> Efectivo
            <input type="radio" name="pago"> Tarjeta
          </div>

          <input type="button" value="Enviar pedido" class="guardar">
        </form>
      </div>

      <div class="card envios">
        <h2>Envío disponible</h2>

        <div class="envio">
          <img src="../img/didi.png">
          <span>Didi Food</span>
        </div>

        <div class="envio">
          <img src="../img/uber.png">
          <span>Uber Eats</span>
        </div>

        <div class="envio">
          <img src="../img/rappi.png">
          <span>Rappi</span>
        </div>

        <div class="envio">
          <img src="../img/local.png">
          <span>Entrega local</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
