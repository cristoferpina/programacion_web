<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="pagina">
        <div class="menu">
            <div class="menu-izquierdo"> 
                <a href="#">Airtable</a>
                <a href="#">Platform</a>
                <a href="#">Solutions</a>
                <a href="#">Resources</a>
                <a href="#">Enterprising</a>
            </div>
            <div class="menu-derecho">
                <a href="#">Contact Sales</a>
                <a href="#">Sign up</a>
                <a href="#">Sign in</a>
            </div>
        </div>
        <div class="contenido">
            <div class="informacion">
                <h1>Contact our sales team</h1>
                <p>Build better proccesses, faster with Airtable.</p>
                <ul>
                    <li>Vimeo</li>
                    <li>JetBlue</li>
                    <li>Dropbox</li>
                </ul>
                <p>Trusted by 50%</p>
                <div class="iconos-servicio">
                    <img src="images/aws.png" alt="aws">
                    <img src="images/walmart.png" alt="walmart">
                    <img src="images/hbo.png" alt="hbo">
                    <img src="images/vanguard.png" alt="vanguard">
                    <img src="images/levis.png" alt="levis">
                </div>
                <p>For technical or product support.</p>
            </div>
            <div class="formulario">
                <form action="#" class="formulario-elemento">
                    <h3 class="titulo-formulario">Contact our sales team</h3>
                    <input placeholder="* First name" class="nombre" type="text">
                    <input placeholder="* Last name" class="apellido" type="text">
                    <input placeholder="* Work email" class="correo" type="email">
                    <input placeholder="* Phone number" class="telefono" type="number">
                    <input placeholder="* Company name" class="compañia" type="text">
                    <input placeholder="* Job Title" class="trabajo" type="text">
                    <select class="pais" name="" id="">
                        <option value="1">How can our team help?</option>
                    </select>
                    <textarea placeholder="* How are you looking?" class="uso" name="" id=""></textarea>
                    <p class="parrafo-formulario">By clicking "Submit".</p>
                    <input type="submit" value="Submit" class="boton">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
