<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="/Segundo_parcial/3/css/styles.css">
</head>

<body>
    <form action="#" method="post">
        <label for="Nombre">Nombre:</label>
        <input type="text" id="Nombre" name="Nombre">
        <br>

        <label for="Apellido">Apellido:</label>
        <input type="text" id="Apellido" name="Apellido">
        <br>

        <label>Género:</label>
        <input type="radio" id="hombre" name="genero" value="hombre">
        <label for="hombre">Hombre</label>
        <input type="radio" id="mujer" name="genero" value="mujer">
        <label for="mujer">Mujer</label>
        <br>

        <label>Selecciona algo:</label>
        <input type="checkbox" id="pera" name="cosa" value="pera">
        <label for="pera">Pera</label>
        <input type="checkbox" id="manzana" name="cosa" value="manzana">
        <label for="manzana">Manzana</label>
        <input type="checkbox" id="ambos" name="cosa" value="ambos">
        <label for="ambos">Ambos</label>
        <br>

        <label for="color">Elige un color:</label>
        <select id="color" name="color" size="2" multiple>
            <option value="0">Selecciona un color</option>
            <option value="1">Verde</option>
            <option value="2">Azul</option>
            <option value="3">Rojo</option>
        </select>
        <br>

        <label for="comentarios">Comentarios:</label>
        <textarea id="comentarios" name="comentarios" rows="10" cols="30"></textarea>
        <br>

        <input type="color" name="colorpicker" id="colorpicker">
        <br>
        <input type="date" name="fecha" id="fecha">
        <br>
        <input type="datetime-local" name="fechahora" id="fechahora">
        <br>
        <input type="email" name="correo" id="correo">
        <br>
        <input type="file" name="archivo" id="archivo">
        <br>
        <input type="hidden" name="oculto" value="valor">
        <br>
        <input type="image" src="imagen.png" alt="Enviar imagen">
        <br>
        <input type="month" name="mes" id="mes">
        <br>
        <input type="number" name="numero" id="numero">
        <br>
        <input type="password" name="clave" id="clave">
        <br>
        <input type="range" name="rango" id="rango">
        <br>
        <input type="reset" value="Resetear">
        <br>
        <input type="submit" value="Enviar">
        <br>
        <input type="tel" name="telefono" id="telefono">
        <br>
        <input type="time" name="hora" id="hora">
        <br>
        <input type="url" name="sitio" id="sitio">
        <br>
        <input type="week" name="semana" id="semana">
    </form>
</body>

</html>
