<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <div class="contenedor">
        <label class="titulo">Registro de Usuarios</label>
        <form action="#" class="formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Escribe tu nombre">

            <label>Elige el nivel de Usuario</label>
            <div class="radio">
                <input type="radio" name="nivel" id="admin">
                <label for="admin">Administrador</label>

                <input type="radio" name="nivel" id="usuario">
                <label for="usuario">Usuario</label>
            </div>

            <label for="user">Nombre del Usuario</label>
            <input type="text" name="user" id="user" placeholder="Ingrese su Usuario">

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="****">

            <div class="checkbox">
                <input type="checkbox" id="terminos">
                <label for="terminos">Acepto los Términos y Condiciones</label>
            </div>

            <div class="btn_group">
                <a href="#" class="cancelar">Cancelar</a>
                <input type="button" name="guardar" class="guardar" value="Registrar">
            </div>
        </form>
    </div>
</body>
</html>
